name: Update bundle

# Builds the on-site update bundle on Node 20 and installs that exact bundle on
# Linux and Windows: SQL migrations, production start, strict health check,
# HTTPS enforcement, integrity report, backup/restore verification and a PDF
# rendered with the operating system's own browser. The bundle is kept as a
# workflow artifact; ship only a bundle built by this workflow from main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build bundle on Node 20
        run: scripts/make-update-bundle.sh "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: invoiceme-update-bundle
          path: ${{ runner.temp }}/bundle/
          retention-days: 30

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      DB: invoiceme_bundle
      API_PORT: '3456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: invoiceme-update-bundle
          path: dl

      - name: Verify checksums and extract
        run: |
          cd dl
          sha256sum -c ./*.tar.gz.sha256
          mkdir -p ../site && tar -xzf ./*.tar.gz -C ../site
          cd ../site/invoiceme-backend-*
          sha256sum -c --quiet SHA256SUMS
          cat VERSION.txt
          # Mixed form (D:/a/...) on Windows: usable by bash and as a step working-directory.
          if command -v cygpath > /dev/null; then echo "BUNDLE=$(cygpath -m "$PWD")"; else echo "BUNDLE=$PWD"; fi >> "$GITHUB_ENV"

      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          echo "PGHOST=localhost" >> "$GITHUB_ENV"
          echo "PGBINDIR=/usr/bin" >> "$GITHUB_ENV"
          echo "BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\psql.exe" -U postgres -c "ALTER USER postgres PASSWORD 'postgres'"
          "PGHOST=localhost" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PGBINDIR=$($env:PGBIN -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BROWSER=C:/Program Files/Google/Chrome/Application/chrome.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          PGPASSWORD: root

      - name: Create the database from the bundle's SQL migrations
        run: |
          "$PGBINDIR/psql" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $DB"
          for f in "$BUNDLE"/migrations/[0-9][0-9][0-9]_*.sql; do
            "$PGBINDIR/psql" -v ON_ERROR_STOP=1 -q --single-transaction -d "$DB" -f "$f" > /dev/null
          done
          "$PGBINDIR/psql" -At -d "$DB" -c "select count(*) from information_schema.tables where table_schema='public'"
          # Synthetic rows and a used sequence, so the restore check compares real data and sequence positions.
          "$PGBINDIR/psql" -v ON_ERROR_STOP=1 -q -d "$DB" <<'SQL'
          INSERT INTO users (id, email, password_hash, name) VALUES ('11111111-1111-1111-1111-111111111111', 'owner@bundle-ci.invalid', 'x', 'CI Owner');
          INSERT INTO clients (id, user_id, name, email, phone, notes) VALUES
            ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'Fictional Supplies Ltd', 'ap@bundle-ci.invalid', '+10000000000', 'synthetic'),
            ('33333333-3333-3333-3333-333333333333', '11111111-1111-1111-1111-111111111111', 'Sample Traders', 'x@bundle-ci.invalid', NULL, NULL);
          CREATE SEQUENCE ci_receipt_no;
          SELECT nextval('ci_receipt_no'), nextval('ci_receipt_no');
          SQL

      - name: Install production dependencies (Node 20)
        working-directory: ${{ env.BUNDLE }}
        run: |
          node --version
          PUPPETEER_SKIP_DOWNLOAD=true npm ci --omit=dev --no-audit --no-fund

      - name: Start dist/main.js in production mode
        working-directory: ${{ env.BUNDLE }}
        env:
          NODE_ENV: production
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: ${{ env.DB }}
          JWT_SECRET: ci-only-not-a-secret-0000000000000000000000
          JWT_REFRESH_SECRET: ci-only-not-a-secret-1111111111111111111111
          CORS_ORIGIN: http://localhost
          FRONTEND_URL: http://localhost
        run: |
          node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for i in $(seq 1 60); do
            if node healthcheck.js > /dev/null 2>&1; then break; fi
            sleep 1
          done
          node healthcheck.js || { cat "$RUNNER_TEMP/backend.log"; exit 1; }

      - name: HTTPS enforcement (plain HTTP, no trusted proxy)
        run: |
          base="http://127.0.0.1:$API_PORT/api/v1"
          get=$(curl -s -o /dev/null -w '%{http_code}' "$base/invoices")
          post=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/auth/login")
          spoof=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json' -d '{}' "$base/auth/login")
          # Without PUBLIC_ORIGIN/TRUSTED_HOSTS a plain-HTTP GET is refused, never
          # redirected to a destination taken from the Host header.
          evil=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: evil.example' "$base/invoices")
          loc=$(curl -s -D - -o /dev/null "$base/invoices" | grep -ci '^location:' || true)
          echo "GET $get, POST $post, POST with spoofed X-Forwarded-Proto $spoof, GET with Host evil.example: '$evil', Location headers: $loc"
          [ "$get" = 403 ] && [ "$post" = 403 ] && [ "$spoof" = 403 ] && [ "$evil" = "403 " ] && [ "$loc" = 0 ]

      - name: Integrity report (read-only)
        working-directory: ${{ env.BUNDLE }}
        run: INTEGRITY_DATABASE_URL="postgres://postgres:postgres@localhost:5432/$DB" node dist/integrity/integrity-report.js

      - name: Backup and restore verification
        working-directory: ${{ env.BUNDLE }}
        run: |
          "$PGBINDIR/pg_dump" -Fc -d "$DB" -f "$RUNNER_TEMP/bundle.dump"
          "$PGBINDIR/psql" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${DB}_restore"
          "$PGBINDIR/pg_restore" --no-owner -d "${DB}_restore" "$RUNNER_TEMP/bundle.dump"
          export VERIFY_SOURCE_URL="postgres://postgres:postgres@localhost:5432/$DB"
          export VERIFY_RESTORED_URL="postgres://postgres:postgres@localhost:5432/${DB}_restore"
          # Another session on the source (deterministic; the backend's pool may have closed its idle
          # connections): the result must be NOT PROVEN, not OK.
          "$PGBINDIR/psql" -d "$DB" -c "select pg_sleep(60)" > /dev/null 2>&1 &
          holder=$!
          sleep 3
          set +e; node dist/ops/verify-restore.js > "$RUNNER_TEMP/busy.txt"; busy=$?; set -e
          cat "$RUNNER_TEMP/busy.txt"
          [ "$busy" = 1 ] && grep -q "NOT PROVEN" "$RUNNER_TEMP/busy.txt" && ! grep -q "^OK:" "$RUNNER_TEMP/busy.txt" \
            || { echo "expected NOT PROVEN while another session is connected, got exit $busy"; exit 1; }
          kill "$holder" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/backend.pid")"
          "$PGBINDIR/psql" -At -d postgres -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = '$DB' and pid <> pg_backend_pid()" > /dev/null
          sleep 3
          # A dump round trip re-prints one CHECK rule: exit 4 (review needed) until a person accepts it.
          set +e; node dist/ops/verify-restore.js > "$RUNNER_TEMP/quiet.txt"; quiet=$?; set -e
          cat "$RUNNER_TEMP/quiet.txt"
          [ "$quiet" = 4 ] && grep -q "^REVIEW NEEDED" "$RUNNER_TEMP/quiet.txt" \
            || { echo "expected exit 4 (EQUIVALENT definitions to review), got $quiet"; exit 1; }
          VERIFY_ACCEPT_EQUIVALENT=true node dist/ops/verify-restore.js | tee "$RUNNER_TEMP/quiet.txt"
          grep -q "^OK: all" "$RUNNER_TEMP/quiet.txt"
          grep -qE "\[MATCH\] clients: source 2 rows, restored 2 rows" "$RUNNER_TEMP/quiet.txt"
          grep -qE "\[MATCH\] sequences: source 1, restored 1" "$RUNNER_TEMP/quiet.txt"

      - name: Render PDFs with the system browser
        working-directory: ${{ env.BUNDLE }}
        env:
          SMOKE_INVOICE_NUMBER: BUNDLE-INV-0001
        run: |
          echo "browser: $BROWSER"
          cp "$GITHUB_WORKSPACE/backend/test/container/pdf-smoke.js" ./pdf-smoke.ci.js
          PUPPETEER_EXECUTABLE_PATH="$BROWSER" SMOKE_DIST_DIR="$PWD/dist" node pdf-smoke.ci.js > "$RUNNER_TEMP/smoke.json"
          node "$GITHUB_WORKSPACE/backend/test/bundle/validate-smoke.js" "$RUNNER_TEMP/smoke.json" BUNDLE-INV-0001

      - name: Backend log
        if: always()
        run: cat "$RUNNER_TEMP/backend.log" 2>/dev/null | tail -50 || true
