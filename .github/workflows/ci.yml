name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # backend/.puppeteerrc.cjs skips Puppeteer's Chrome download (no
      # variable needed); the next step fails if a browser was downloaded.
      # Every unit/E2E test mocks PdfService; real PDFs are rendered by the
      # container smoke test below and by the update-bundle workflow.
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: No Puppeteer browser was downloaded
        run: |
          if [ -d "$HOME/.cache/puppeteer" ]; then
            ls -R "$HOME/.cache/puppeteer" | head -20
            echo "npm ci downloaded a browser: is backend/.puppeteerrc.cjs missing?"
            exit 1
          fi

      # Fails only on findings above scripts/lint-baseline.json (the existing
      # debt is recorded there, not fixed); `npm run lint` shows everything.
      - name: Lint (no new findings)
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: Run migrations against test database
        run: npm run migration:run -- -d migrations/data-source.ts
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: invoiceme_test

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-chars
          # DB_TEST_* is read by the e2e test override; DB_* is read by the
          # app's own DatabaseModule (src/core/database.module.ts). Provide
          # both so every connection path gets a valid string password.
          DB_TEST_HOST: localhost
          DB_TEST_PORT: 5432
          DB_TEST_USERNAME: postgres
          DB_TEST_PASSWORD: postgres
          DB_TEST_DATABASE: invoiceme_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: invoiceme_test
          # Build the test schema from entities (raw .sql files aren't TypeORM
          # migration classes, so migration:run can't create it).
          DB_SYNCHRONIZE: 'true'

      - name: Build
        run: npm run build

      # Timeouts turn a stalled network fetch into a failure instead of a hang.
      - name: Build Docker image
        working-directory: .
        timeout-minutes: 20
        run: docker build -t invoiceme-backend:ci ./backend

      # Renders a synthetic invoice PDF inside the image through the real
      # PdfService/PdfCacheService and Alpine's Chromium, then validates it.
      - name: Container PDF smoke test
        working-directory: .
        timeout-minutes: 10
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          backend/test/container/pdf-smoke.sh invoiceme-backend:ci

  # verify-restore.e2e-spec.ts skips its Unix-socket identity test unless a
  # PostgreSQL socket exists on the machine running Jest. The backend job's
  # service container exposes TCP only, so this job uses the PostgreSQL
  # preinstalled on the runner (socket in /var/run/postgresql) and fails if
  # that test is skipped instead of run.
  restore-socket:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start the runner's PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          # Ubuntu's default for the local socket is peer authentication (OS
          # user must be postgres); use the password instead, like over TCP.
          hba=$(sudo -u postgres psql -Atc 'show hba_file')
          sudo sed -i '1i local all postgres scram-sha-256' "$hba"
          sudo -u postgres psql -c 'select pg_reload_conf()'
          sudo -u postgres psql -c 'CREATE DATABASE invoiceme_test'
          ls -la /var/run/postgresql/
          PGPASSWORD=postgres psql -h /var/run/postgresql -U postgres -d invoiceme_test -Atc 'select 1'

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Restore verification E2E, including the Unix-socket test
        env:
          DB_TEST_HOST: localhost
          DB_TEST_PORT: 5432
          DB_TEST_USERNAME: postgres
          DB_TEST_PASSWORD: postgres
          DB_TEST_DATABASE: invoiceme_test
        run: |
          npx jest --config ./test/jest-e2e.json --runInBand --json --outputFile="$RUNNER_TEMP/verify-restore.json" test/verify-restore.e2e-spec.ts
          node -e '
            const r = require(process.argv[1]);
            const all = r.testResults.flatMap((s) => s.assertionResults);
            const t = all.find((a) => a.title === "identifies the same database over a Unix socket and over TCP");
            console.log(`${all.length} tests; socket test: ${t ? t.status : "not found"}`);
            if (!t || t.status !== "passed") process.exit(1);
          ' "$RUNNER_TEMP/verify-restore.json"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Service tests
        run: flutter test test/services/

      - name: Utility tests
        run: flutter test test/utils/

      - name: Coverage
        run: flutter test --coverage
