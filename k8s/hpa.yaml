# HorizontalPodAutoscaler for the InvoiceMe backend.
# Usage: kubectl apply -f k8s/

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: invoiceme-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: invoiceme-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
