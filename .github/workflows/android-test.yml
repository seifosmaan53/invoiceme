name: Android test candidate

# A sync TEST build of the Android app plus on-device tests on an emulator
# against a real backend started in the same job. Nothing is published or
# installed anywhere else; the test APK is signed with the runner's Android
# debug keystore (no key is stored in the repository).

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL compiled into the test APK (empty: http://10.0.2.2:3000/api/v1, the emulator host)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-test.yml'

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'
  # Test build switch read by mobile/android/app/build.gradle.kts:
  # app id suffix .synctest, label "InvoiceMe (sync test)", cleartext HTTP.
  ORG_GRADLE_PROJECT_invoicemeTestBuild: 'true'

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK on the runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3

      - run: flutter pub get

      - name: Build the sync test APK (debug-signed)
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          defines=()
          if [ -n "$API_BASE_URL" ]; then defines+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          flutter build apk --release "${defines[@]}"

      - name: Check app id, label and signature; checksum
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/aapt" dump badging "$apk" | grep -E "^package:|^application-label:" | tee badging.txt
          grep -q "name='com.example.invoiceme.synctest'" badging.txt
          grep -q "application-label:'InvoiceMe (sync test)'" badging.txt
          "$bt/apksigner" verify --print-certs "$apk" | tee signature.txt
          grep -q "CN=Android Debug" signature.txt
          mkdir -p ../apk-out
          cp "$apk" ../apk-out/invoiceme-synctest-${GITHUB_SHA::7}.apk
          (cd ../apk-out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          cp badging.txt signature.txt ../apk-out/

      - uses: actions/upload-artifact@v4
        with:
          name: invoiceme-synctest-apk
          path: apk-out/
          retention-days: 14

  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceme_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only values; synthetic data. No payment provider is configured.
      NODE_ENV: test
      API_PORT: '3000'
      API_HOST: 0.0.0.0
      JWT_SECRET: ci-android-e2e-jwt-secret-minimum-32-characters
      JWT_REFRESH_SECRET: ci-android-e2e-refresh-secret-minimum-32-chars
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: invoiceme_e2e
      DB_SYNCHRONIZE: 'true'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: invoiceme_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build the backend
        working-directory: backend
        timeout-minutes: 15
        run: npm ci && npm run build

      - name: Start the backend
        working-directory: backend
        run: |
          nohup node dist/main > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Synthetic test user, paid invoice with a partial refund
        working-directory: mobile
        run: |
          API=http://localhost:3000/api/v1 ./integration_test/seed_backend.sh > "$RUNNER_TEMP/seed.env"
          cut -d= -f1 "$RUNNER_TEMP/seed.env"
          cat "$RUNNER_TEMP/seed.env" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: flutter test integration_test/android_sync_test.dart -d emulator-5554 --reporter expanded --dart-define=E2E_API=http://10.0.2.2:3000/api/v1 --dart-define=E2E_EMAIL="$E2E_EMAIL" --dart-define=E2E_PASSWORD="$E2E_PASSWORD" --dart-define=E2E_PAID_INVOICE_ID="$E2E_PAID_INVOICE_ID"

      - name: Backend log
        if: always()
        run: tail -200 "$RUNNER_TEMP/backend.log" || true
