# Kubernetes Deployment for the InvoiceMe backend.
# Usage: kubectl apply -f k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceme-backend
  labels:
    app: invoiceme-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: invoiceme-backend
  template:
    metadata:
      labels:
        app: invoiceme-backend
    spec:
      containers:
      - name: backend
        image: invoiceme/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: invoiceme-secrets
              key: db-host
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: invoiceme-secrets
              key: db-password
        # Add other environment variables from secrets/config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          # httpGet counts any 2xx/3xx as success, so an HTTPS redirect would
          # pass; the script requires HTTP 200 and the expected body.
          exec:
            command: ["node", "healthcheck.js"]
          timeoutSeconds: 5
          initialDelaySeconds: 40
          periodSeconds: 30
        readinessProbe:
          # httpGet counts any 2xx/3xx as success, so an HTTPS redirect would
          # pass; the script requires HTTP 200 and the expected body.
          exec:
            command: ["node", "healthcheck.js"]
          timeoutSeconds: 5
          initialDelaySeconds: 10
          periodSeconds: 10
