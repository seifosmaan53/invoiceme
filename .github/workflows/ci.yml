name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Every test mocks PdfService, so no real Chromium is ever launched.
          # Skipping the ~170MB Puppeteer download keeps install fast and reliable.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Unit tests
        run: npm test

      - name: Run migrations against test database
        run: npm run migration:run -- -d migrations/data-source.ts
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: invoiceme_test

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-chars
          # DB_TEST_* is read by the e2e test override; DB_* is read by the
          # app's own DatabaseModule (src/core/database.module.ts). Provide
          # both so every connection path gets a valid string password.
          DB_TEST_HOST: localhost
          DB_TEST_PORT: 5432
          DB_TEST_USERNAME: postgres
          DB_TEST_PASSWORD: postgres
          DB_TEST_DATABASE: invoiceme_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: invoiceme_test
          # Build the test schema from entities (raw .sql files aren't TypeORM
          # migration classes, so migration:run can't create it).
          DB_SYNCHRONIZE: 'true'

      - name: Build
        run: npm run build

      - name: Build Docker image
        working-directory: .
        run: docker build -t invoiceme-backend:ci ./backend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Service tests
        run: flutter test test/services/

      - name: Utility tests
        run: flutter test test/utils/

      - name: Coverage
        run: flutter test --coverage
